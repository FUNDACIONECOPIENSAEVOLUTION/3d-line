name: Publicar beta en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos públicos
        run: |
          mkdir -p site
          cp index.html game.js styles.css version.json README.md auth-config.json site/
          touch site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Publicar el juego
        id: deployment
        uses: actions/deploy-pages@v4
